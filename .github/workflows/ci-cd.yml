name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  # Ручной запуск кнопкой "Run workflow" или `gh workflow run`.
  # Нужен только для откат-деплоя уже собранного образа (задача 7).
  workflow_dispatch:
    inputs:
      # Какой образ деплоить при ручном запуске. Доступен как inputs.image_tag.
      image_tag:
        description: "Тег образа для деплоя, например sha-abc1234"
        type: string
        required: false

# Не даёт двум запускам для одной ветки идти одновременно.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Условие запуска задачи. При ручном запуске образ уже собран
    # и протестирован, поэтому тесты пропускаем.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Скачивает код репозитория на виртуальную машину (по умолчанию она пустая).
      - uses: actions/checkout@v4

      # Устанавливает Go. Версия берётся из go.mod, чтобы не дублировать её здесь.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Проверка форматирования кода.
      # gofmt -l выводит список файлов, которые отформатированы не по gofmt,
      # но сам всегда завершается с кодом 0. Поэтому падение делаем вручную:
      # если список непустой — печатаем его и выходим с кодом 1.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # Бинарник никуда не сохраняется — это только проверка сборки.
      - name: Build
        run: go build ./...

  build-push:
    # Образ собираем только после зелёных тестов.
    needs: test
    # Только push в main: на pull request публиковать образ не нужно.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Если задать permissions у задачи, все неуказанные права становятся none,
    # поэтому contents: read (для checkout) перечисляем явно.
    # packages: write даёт встроенному GITHUB_TOKEN право писать в GHCR.
    permissions:
      contents: read
      packages: write
    # Значение, которое смогут прочитать другие задачи через
    # needs.build-push.outputs.image_tag.
    outputs:
      image_tag: ${{ steps.tags.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      # Короткий хеш — первые 7 символов полного SHA коммита.
      # Запись в $GITHUB_OUTPUT делает значение доступным как
      # steps.tags.outputs.image_tag.
      - name: Compute image tag
        id: tags
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Buildx с драйвером docker-container. Обычный драйвер docker
      # не умеет экспортировать кэш в type=gha.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/crypto-stream/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/pitshifer/crypto-stream:${{ steps.tags.outputs.image_tag }}
            ghcr.io/pitshifer/crypto-stream:main
          # Кэш слоёв в хранилище GitHub Actions
          # mode=max кэширует и промежуточные
          # слои стадии builder, а не только итоговый образ.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    # Грабля: если зависимость из needs пропущена (а при workflow_dispatch
    # build-push всегда пропущена), задача по умолчанию тоже пропускается —
    # молча, с зелёным пайплайном. !cancelled() заставляет условие
    # вычисляться в любом случае, а дальше мы сами разрешаем два сценария:
    # ручной откат или успешная сборка после push в main.
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.build-push.result == 'success'))
    runs-on: ubuntu-latest
    env:
      # При ручном запуске — тег из параметра, иначе — свежесобранный образ.
      # Конструкция `a && b || c` — тернарный оператор в выражениях Actions.
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || needs.build-push.outputs.image_tag }}
      GRPC_BIND_ADDR: ${{ vars.GRPC_BIND_ADDR }}
      DEPLOY_DIR: /opt/crypto-stream
    steps:
      # Нужен только ради compose.prod.yml — исходники на сервер не попадают.
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      - name: Copy compose file
        run: scp compose.prod.yml "vps:$DEPLOY_DIR/compose.prod.yml"

      - name: Write .env
        run: |
          printf 'IMAGE_TAG=%s\nGRPC_BIND_ADDR=%s\n' "$IMAGE_TAG" "$GRPC_BIND_ADDR" \
            | ssh vps "cat > $DEPLOY_DIR/.env"

      # Ловит пустой IMAGE_TAG / GRPC_BIND_ADDR (см. ${VAR:?} в compose.prod.yml)
      # до того, как работающий контейнер будет остановлен.
      - name: Validate compose config
        run: ssh vps "cd $DEPLOY_DIR && docker compose -f compose.prod.yml config >/dev/null"

      - name: Pull and restart
        run: |
          ssh vps "set -e
            cd $DEPLOY_DIR
            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d
            docker image prune -f"

      # up -d возвращает 0, даже если контейнер упал через секунду.
      # Одного статуса running мало: при restart: unless-stopped падающий
      # контейнер перезапускается по кругу и в момент проверки вполне может
      # оказаться running. Поэтому дополнительно требуем RestartCount == 0.
      # Heredoc в кавычках ('EOF') не раскрывает $ локально — скрипт
      # уходит на сервер как есть, каталог передаётся аргументом $1.
      - name: Check container is running
        run: |
          sleep 10
          ssh vps bash -s -- "$DEPLOY_DIR" <<'EOF'
          set -e
          cd "$1"
          id=$(docker compose -f compose.prod.yml ps -aq cryptostream)
          if [ -z "$id" ]; then
            echo "::error::container cryptostream not found"
            exit 1
          fi
          read -r status restarts <<< "$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' "$id")"
          echo "status=$status restarts=$restarts"
          if [ "$status" != "running" ] || [ "$restarts" -ne 0 ]; then
            echo "::error::container is not healthy: status=$status restarts=$restarts"
            exit 1
          fi
          EOF

      # !cancelled(): логи нужны и тогда, когда проверка выше упала —
      # именно в этом случае в них ошибка валидации конфига.
      - name: Show logs
        if: ${{ !cancelled() }}
        run: ssh vps "cd $DEPLOY_DIR && docker compose -f compose.prod.yml logs --tail 30"
